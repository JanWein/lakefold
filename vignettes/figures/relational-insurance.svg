<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title description">
  <title id="title">Two relational enrichment paths, one monthly insurance report</title>
  <desc id="description">Policy-month snapshots reference one broker. Each payment references one policy-month snapshot. Checked lookups use dm relationship validation while preserving each fact at its original grain. Two independently contracted staging products feed separate dbt monthly aggregates. Only those unique company, channel and month aggregates are joined into the reporting mart. An immutable published mart feeds governed measures and an issued report.</desc>
  <defs>
    <marker id="lookup" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#617189"/></marker>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#247460"/></marker>
  </defs>
  <rect width="1000" height="1080" rx="18" fill="#f6f8fb"/>
  <g font-family="Arial, sans-serif" fill="#183247">
    <text x="40" y="45" font-size="26" font-weight="bold">Two facts, two safe enrichment paths</text>
    <text x="40" y="75" font-size="17" fill="#526477">Keep the meaning of one row explicit throughout the workflow.</text>
    <g stroke="#a7bbcc" stroke-width="1.5" fill="#fff">
      <rect x="40" y="112" width="250" height="143" rx="10"/>
      <rect x="375" y="112" width="250" height="143" rx="10"/>
      <rect x="710" y="112" width="250" height="143" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="165" y="143" font-size="21" font-weight="bold">Brokers</text>
      <text x="165" y="177" font-size="17">One row per broker</text>
      <text x="165" y="207" font-size="16">Key: broker ID</text>
      <text x="165" y="235" font-size="16">Broker name and channel</text>
      <text x="500" y="143" font-size="21" font-weight="bold">Policy snapshots</text>
      <text x="500" y="177" font-size="17">One policy in one month</text>
      <text x="500" y="207" font-size="16">Key: policy ID + month</text>
      <text x="500" y="235" font-size="16">12 rows; status and due</text>
      <text x="835" y="143" font-size="21" font-weight="bold">Payments</text>
      <text x="835" y="177" font-size="17">One cash transaction</text>
      <text x="835" y="207" font-size="16">Key: payment ID</text>
      <text x="835" y="235" font-size="16">10 rows; cash received</text>
    </g>
    <g stroke="#617189" stroke-width="2" fill="none" marker-end="url(#lookup)">
      <path d="M374 193H294"/>
      <path d="M709 193H629"/>
    </g>
    <g text-anchor="middle" font-size="15" fill="#526477">
      <text x="333" y="172">many to 1</text>
      <text x="667" y="172">many to 1</text>
    </g>
    <text x="40" y="292" font-size="17">add_lookup() checks keys and preserves each row.</text>
    <g stroke="#247460" stroke-width="2.5" fill="none" marker-end="url(#flow)">
      <path d="M500 256V316H265V351"/>
      <path d="M835 256V316H735V351"/>
      <path d="M265 502V579"/>
      <path d="M735 502V579"/>
      <path d="M265 708V746H380V793"/>
      <path d="M735 708V746H620V793"/>
      <path d="M500 909V954"/>
    </g>
    <g stroke="#8ab7a8" stroke-width="1.5" fill="#e8f4ef">
      <rect x="70" y="355" width="390" height="147" rx="10"/>
      <rect x="540" y="355" width="390" height="147" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="265" y="385" font-size="16" fill="#37624f">R: PUBLISHED STAGING PRODUCT</text>
      <text x="265" y="417" font-size="21" font-weight="bold">Enriched portfolio</text>
      <text x="265" y="447" font-size="17">12 policy-month rows + broker attributes</text>
      <text x="265" y="478" font-size="16">Its own contract and immutable release</text>
      <text x="735" y="385" font-size="16" fill="#37624f">R: PUBLISHED STAGING PRODUCT</text>
      <text x="735" y="417" font-size="21" font-weight="bold">Enriched payments</text>
      <text x="735" y="447" font-size="17">10 transactions + policy + broker attributes</text>
      <text x="735" y="478" font-size="16">Its own contract and immutable release</text>
    </g>
    <rect x="310" y="523" width="380" height="39" rx="7" fill="#fff0e8"/>
    <text x="500" y="548" text-anchor="middle" font-size="16" fill="#8a4b26">Do not join these two fact tables to sum due.</text>
    <g stroke="#9bb6d2" stroke-width="1.5" fill="#eaf1fb">
      <rect x="70" y="583" width="390" height="125" rx="10"/>
      <rect x="540" y="583" width="390" height="125" rx="10"/>
      <rect x="255" y="797" width="490" height="112" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="265" y="613" font-size="16" fill="#435e83">dbt CORE</text>
      <text x="265" y="643" font-size="21" font-weight="bold">Portfolio aggregate</text>
      <text x="265" y="673" font-size="17">Active policy count and premium due</text>
      <text x="265" y="696" font-size="15">One company / channel / month</text>
      <text x="735" y="613" font-size="16" fill="#435e83">dbt CORE</text>
      <text x="735" y="643" font-size="21" font-weight="bold">Cash aggregate</text>
      <text x="735" y="673" font-size="17">Cash received</text>
      <text x="735" y="696" font-size="15">One company / channel / month</text>
      <text x="500" y="777" font-size="17" fill="#435e83">Join one to one</text>
      <text x="500" y="827" font-size="16" fill="#435e83">dbt MART</text>
      <text x="500" y="858" font-size="22" font-weight="bold">Monthly insurance reporting</text>
      <text x="500" y="889" font-size="17">Explicit schema, key and reconciliation tests</text>
    </g>
    <rect x="70" y="958" width="860" height="82" rx="10" fill="#fff" stroke="#a7bbcc" stroke-width="1.5"/>
    <text x="500" y="989" text-anchor="middle" font-size="20" font-weight="bold">Published mart release → governed measures → issued report</text>
    <text x="500" y="1018" text-anchor="middle" font-size="17">Corrections create new releases. The issued report keeps its original values.</text>
  </g>
</svg>
