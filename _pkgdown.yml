url: https://janwein.github.io/tidyweave/
destination: site
home:
  title: Modular checked data products
  description: Compose reusable product specifications, preparation recipes and execution workflows.
template:
  bootstrap: 5
  bslib:
    primary: "#17645b"
    link-color: "#125e75"
    border-radius: 0.35rem
navbar:
  structure:
    left: [getstarted, articles, reference, news]
    right: [search, github]
  components:
    getstarted:
      text: Get started
      href: articles/get-started.html
reference:
  - title: Product specifications
    desc: Define output identity and requirements independently of preparation.
    contents: [tidyweave-package, tw_product, tw_add_contract, tw_contract, tw_contract_update, tw_model]
  - title: Preparation recipes
    desc: Compose ordered steps and choose implementations for reusable operations.
    contents: [tw_recipe, tw_step_transform, tw_step_lookup, tw_lookup_spec, tw_set_engine, tw_add_transform, product-dplyr]
  - title: Workflow assembly
    desc: Add, update, remove and extract independent components without executing them.
    contents: [tw_workflow, workflow-components, tw_add_source, tw_add_lookup, tw_set_target, tw_replace_sources, tw_execution_config, tw_inspect, tw_plan, tw_validate]
  - title: Execution and results
    desc: Try a delivery, run configured destinations, publish checked output and collect results.
    contents: [tw_trial, tw_run, tw_publish, tw_collect, tw_status, tw_lineage]
  - title: Quality rules and diagnostics
    contents: [tw_quality_rule, tw_quality_reference, tw_quality, tw_quality_report, tw_quality_rows, tw_quality_errors, tw_expect_quality, tw_profile_data, tw_pointblank_report, tw_contract_from, tw_contract_confirm, tw_contract_diff, tw_contract_yaml]
