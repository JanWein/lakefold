  - title: Lake configuration and operations
    contents: [tw_open_lake, tw_ingest, tw_lake_config, tw_registry_duckdb, tw_setup_lake, tw_disconnect_lake, tw_write_data, tw_read_release, tw_tbl, tw_releases, tw_register, tw_registry, tw_freshness, tw_check_delivery, tw_interrupted, tw_recover, tw_cleanup]
