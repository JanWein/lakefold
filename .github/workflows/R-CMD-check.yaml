name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    name: R 4.5.1 (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [duckdb, ducklake]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      TIDYWEAVE_TEST_BACKEND: ${{ matrix.backend }}
      TIDYWEAVE_TEST_DUCKLAKE: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"
      DO_NOT_TRACK: "1"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dbt integration engine
        run: |
          python -m venv "$RUNNER_TEMP/tidyweave-dbt"
          "$RUNNER_TEMP/tidyweave-dbt/bin/python" -m pip install dbt-core==1.12.5 dbt-duckdb==1.10.1 duckdb==1.5.5
          "$RUNNER_TEMP/tidyweave-dbt/bin/python" -c "import dbt.cli.main, duckdb"
          echo "TIDYWEAVE_DBT_EXECUTABLE=$RUNNER_TEMP/tidyweave-dbt/bin/dbt" >> "$GITHUB_ENV"
      - name: Check package
        run: Rscript scripts/check.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.backend }}
          path: check/
  compatibility:
    name: ${{ matrix.os }} / R ${{ matrix.r }} (DuckDB)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            r: '4.2.3'
          - os: windows-latest
            r: 'release'
          - os: macos-latest
            r: 'release'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      TIDYWEAVE_TEST_BACKEND: duckdb
      TIDYWEAVE_TEST_DUCKLAKE: "false"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check portable package behavior
        run: Rscript scripts/check.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}
          path: check/
  core:
    name: Core without optional integrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install only hard dependencies
        run: Rscript -e 'install.packages(c("DBI", "dplyr", "dbplyr", "tibble", "rlang", "digest", "jsonlite"))'
      - name: Install core package
        run: R CMD INSTALL .
      - name: Verify an installation without DuckDB
        run: Rscript scripts/check-core.R
