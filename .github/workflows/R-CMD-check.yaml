name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    name: R 4.5.1 (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [duckdb, ducklake]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      DATALOOM_TEST_BACKEND: ${{ matrix.backend }}
      DATALOOM_TEST_DUCKLAKE: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"
      DO_NOT_TRACK: "1"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dbt integration engine
        run: |
          python -m venv "$RUNNER_TEMP/lakefold-dbt"
          "$RUNNER_TEMP/lakefold-dbt/bin/python" -m pip install dbt-core==1.12.5 dbt-duckdb==1.10.1 duckdb==1.5.5
          "$RUNNER_TEMP/lakefold-dbt/bin/python" -c "import dbt.cli.main, duckdb"
          echo "LAKEFOLD_DBT_EXECUTABLE=$RUNNER_TEMP/lakefold-dbt/bin/dbt" >> "$GITHUB_ENV"
      - name: Check package
        run: Rscript scripts/check.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.backend }}
          path: check/
