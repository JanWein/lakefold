name: Coverage
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [core, lake, adapters, metrics, dbt, catalog]
    env:
      NOT_CRAN: "true"
      DATARAFT_TEST_DUCKLAKE: "false"
      DATARAFT_COVERAGE_PACKAGE: ${{ matrix.package }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
            local::.
      - run: Rscript scripts/coverage.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: coverage/
